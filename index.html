<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Northladder Constructions</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=Comfortaa:wght@300..700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Comfortaa', sans-serif;
        }

        body {
            background-color: #f8f9fa;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            background-image: radial-gradient(circle at top right, #e2e8f0 0%, transparent 40%),
                radial-gradient(circle at bottom left, #dbeafe 0%, transparent 40%);
        }

        .container {
            text-align: center;
            background: #ffffff;
            padding: 4rem 5rem;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
            border: 1px solid rgba(0, 123, 255, 0.1);
            animation: fadeIn 1s ease-out;
            max-width: 650px;
            width: 90%;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .logo {
            width: 120px;
            height: 120px;
            margin: 0 auto 1.5rem;
            background: #ffffff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;


        }



        .company-name {
            font-family: 'Times New Roman', serif;
            font-size: 2.2rem;
            font-weight: bold;
            margin-bottom: 0.5rem;
            color: #007BFF;
            letter-spacing: 0.5px;
        }

        .subtitle {
            font-size: 1.1rem;
            font-weight: 500;
            color: #0b3a66;
            margin-bottom: 2.5rem;
            font-family: 'Poppins', sans-serif;
        }

        .buttons {
            display: flex;
            gap: 1.5rem;
            justify-content: center;
        }

        .btn {
            padding: 14px 40px;
            font-size: 1.1rem;
            font-weight: 700;
            font-family: 'Poppins', sans-serif;
            text-decoration: none;
            border-radius: 8px;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            border: 2px solid #007BFF;
            cursor: pointer;
            min-width: 160px;
            display: inline-block;
        }

        .btn-hyderabad {
            background-color: #007BFF;
            color: #ffffff;
            box-shadow: 0 4px 15px rgba(0, 123, 255, 0.3);
        }

        .btn-vizag {
            background-color: transparent;
            color: #007BFF;
        }

        .btn:hover {
            transform: translateY(-3px);
        }

        .btn-hyderabad:hover {
            background-color: #0056b3;
            border-color: #0056b3;
            box-shadow: 0 6px 20px rgba(0, 123, 255, 0.4);
        }

        .btn-vizag:hover {
            background-color: rgba(0, 123, 255, 0.05);
            box-shadow: 0 6px 20px rgba(0, 123, 255, 0.1);
        }

        @media (max-width: 600px) {
            .container {
                padding: 3rem 2rem;
            }

            .buttons {
                flex-direction: column;
            }

            .company-name {
                font-size: 1.8rem;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="logo">
            <img src="logoNorthLadder.jpeg" alt="Northladder Constructions Logo"
                style="width: 100%; height: 100%; object-fit: cover;">
        </div>
        <h1 class="company-name">Northladder Constructions</h1>
        <p class="subtitle">Select your location to explore projects</p>

        <div class="buttons">
            <a href="home.html" class="btn btn-hyderabad">Hyderabad</a>
            <a href="vizag_home.html" class="btn btn-vizag">Vizag</a>
        </div>
    </div>
</body>

</html>
